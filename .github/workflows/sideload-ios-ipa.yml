name: Sideload iOS IPA (Unsigned)

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: 'Build configuration (release = standalone JS bundle, debug-dev-client = Metro dev client)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug-dev-client
      runner:
        description: 'GitHub macOS runner (macos-15-intel avoids arm64 queue; macos-latest/macos-26 use arm64)'
        required: true
        default: 'macos-15-intel'
        type: choice
        options:
          - macos-15-intel
          - macos-latest
          - macos-26
  push:
    branches:
      - feat/dev-oncall-voice
    paths:
      - 'mobile/**'
      - '.github/workflows/sideload-ios-ipa.yml'

concurrency:
  group: sideload-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    name: Build Unsigned iOS IPA
    runs-on: ${{ github.event.inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 90

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.x
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_APP" ]; then
            echo "ERROR: No Xcode 26.x found on runner $(uname -m)"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install root dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch ExpoModulesJSI Swift 6.2 Sendable check for Xcode 26.3
        run: |
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const files = execFileSync("find", ["node_modules/.pnpm", "-path", "*/expo-modules-jsi/apple/Sources/ExpoModulesJSI/Runtime/Values/JavaScriptObject.swift"], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
            for (const f of files) {
              const s = fs.readFileSync(f, "utf8");
              const target = "    nonisolated(unsafe) let slot = buffer.baseAddress!\n    expo.emplaceUndefined(slot)\n    defer {\n      expo.destroyValues(slot, 1)\n    }\n    // The runtime can\x27t be deallocated during a call on its JavaScript thread, so it\x27s borrowed without\n    // a retain.\n    try runtime._withUnsafeGuaranteedRef { runtime in\n      try JavaScriptActor.assumeIsolated {\n        try encode(JavaScriptValue.Slot(slot), runtime)\n      }\n    }";
              const replacement = "    let slot = buffer.baseAddress!\n    let slotAddress = UInt(bitPattern: slot)\n    expo.emplaceUndefined(slot)\n    defer {\n      expo.destroyValues(slot, 1)\n    }\n    try runtime._withUnsafeGuaranteedRef { runtime in\n      try JavaScriptActor.assumeIsolated {\n        let isolatedSlot = UnsafeMutablePointer<facebook.jsi.Value>(bitPattern: slotAddress)!\n        try encode(JavaScriptValue.Slot(isolatedSlot), runtime)\n      }\n    }";
              if (!s.includes(target)) {
                throw new Error("Expected snippet not found in " + f);
              }
              fs.writeFileSync(f, s.replace(target, replacement));
              console.log("Patched", f);
            }
          '

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: npx pod-install ios

      - name: Build unsigned .xcarchive
        env:
          BUILD_PROFILE: ${{ github.event.inputs.build_profile || 'release' }}
        run: |
          set -euo pipefail
          CONFIG="Release"
          if [ "$BUILD_PROFILE" = "debug-dev-client" ]; then
            CONFIG="Debug"
          fi
          echo "Building configuration: $CONFIG (profile=$BUILD_PROFILE)"
          xcodebuild \
            -workspace ios/Orca.xcworkspace \
            -scheme Orca \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -archivePath /tmp/Orca.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Package unsigned .ipa
        env:
          BUILD_PROFILE: ${{ github.event.inputs.build_profile || 'release' }}
        run: |
          set -euo pipefail
          IPA_NAME="Orca-DevOncall-unsigned.ipa"
          if [ "$BUILD_PROFILE" = "debug-dev-client" ]; then
            IPA_NAME="Orca-DevOncall-dev-client-unsigned.ipa"
          fi
          rm -rf /tmp/ipa-stage
          mkdir -p /tmp/ipa-stage/Payload
          cp -R /tmp/Orca.xcarchive/Products/Applications/Orca.app /tmp/ipa-stage/Payload/
          cd /tmp/ipa-stage
          zip -qry "${GITHUB_WORKSPACE}/${IPA_NAME}" Payload
          ls -lh "${GITHUB_WORKSPACE}/${IPA_NAME}"

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orca-DevOncall-unsigned-${{ github.event.inputs.build_profile || 'release' }}
          path: Orca-DevOncall-*.ipa
          retention-days: 14
